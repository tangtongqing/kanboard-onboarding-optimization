ass="label" style="color:#111827 !important" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div style="color: rgb(17, 24, 39) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#111827 !important" class="nodeLabel"><p>小团队迭代<br />适合 2-5 人小团队管理一轮需求<br />需求池→设计中→开发中→测试中→已发布<br />① 定义新手创建向导 P0 范围<br />② 绘制创建向导低保真流程</p></span></div></foreignObject></g></g><g class="node default card" id="my-svg-flowchart-C2B-1" data-look="classic" transform="translate(164, 423.5)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#64748b !important" x="-128" y="-86" width="256" height="172"/><g class="label" style="color:#111827 !important" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div style="color: rgb(17, 24, 39) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#111827 !important" class="nodeLabel"><p>求职准备项目<br />简历·作品集·投递·面试<br />待准备→进行中→已投递→面试中→已完成<br />① 完善产品经理实习简历<br />② 整理 3 个作品集项目</p></span></div></foreignObject></g></g><g class="node default card" id="my-svg-flowchart-C3B-2" data-look="classic" transform="translate(164, 692.5)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#64748b !important" x="-128" y="-110" width="256" height="220"/><g class="label" style="color:#111827 !important" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div style="color: rgb(17, 24, 39) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#111827 !important" class="nodeLabel"><p>个人学习项目<br />产品经理 0→1 学习路径<br />待规划→资料学习→案例拆解→实操产出→复盘完善→已掌握<br />① 理解产品经理职责与能力模型<br />② 建立产品术语清单</p></span></div></foreignObject></g></g><g class="node default card" id="my-svg-flowchart-C4B-3" data-look="classic" transform="translate(164, 973.5)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#64748b !important" x="-128" y="-98" width="256" height="196"/><g class="label" style="color:#111827 !important" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div style="color: rgb(17, 24, 39) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#111827 !important" class="nodeLabel"><p>Bug 跟踪<br />问题→修复→验证→关闭<br />已报告→待确认→修复中→待验证→已关闭<br />① 拖拽后卡片状态未及时刷新<br />② 刷新后评论是否正确保存</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2f5fbb" stop-opacity="1"/><stop offset="100%" stop-color="#16803c" stop-opacity="1"/></linearGradient><style>svg {
