<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanboard V0.5 新手创建向导</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div>
          <h1>Kanboard</h1>
          <p>V0.5 创建向导优化版</p>
        </div>
      </div>

      <button class="primary-action" id="newProjectBtn" type="button">新建项目</button>

      <section class="side-section" aria-label="项目列表">
        <div class="side-heading">项目</div>
        <div class="project-list" id="projectList"></div>
      </section>

      <div class="sidebar-footer">
        <button class="ghost-button" id="resetDemoBtn" type="button">重置演示数据</button>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="project-heading">
          <span class="eyebrow">当前项目</span>
          <h2 id="projectTitle"></h2>
          <p id="projectDescription"></p>
        </div>
        <div class="topbar-actions">
          <button class="secondary-button" id="editProjectBtn" type="button">编辑项目</button>
          <button class="secondary-button" id="addSwimlaneBtn" type="button">新增泳道</button>
          <button class="secondary-button danger" id="deleteProjectBtn" type="button">删除项目</button>
        </div>
      </header>

      <section class="metrics" aria-label="项目指标">
        <div class="metric">
          <span id="metricCards">0</span>
          <p>任务</p>
        </div>
        <div class="metric">
          <span id="metricDoing">0</span>
          <p>进行中</p>
        </div>
        <div class="metric">
          <span id="metricDue">0</span>
          <p>临近截止</p>
        </div>
        <div class="metric">
          <span id="metricDone">0</span>
          <p>完成</p>
        </div>
      </section>

      <section class="toolbar" aria-label="看板工具栏">
        <label class="search-field">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="任务标题、描述、标签">
        </label>
        <label>
          <span>负责人</span>
          <select id="assigneeFilter"></select>
        </label>
        <label>
          <span>分类</span>
          <select id="categoryFilter"></select>
        </label>
        <label>
          <span>泳道</span>
          <select id="swimlaneFilter"></select>
        </label>
        <button class="secondary-button" id="addColumnBtn" type="button">新增列</button>
      </section>

      <section class="board-shell" aria-label="看板">
        <div class="board" id="board"></div>
      </section>
    </main>
  </div>

  <dialog id="projectDialog" class="modal wide">
    <form method="dialog" id="projectForm">
      <div class="modal-header">
        <h3 id="projectDialogTitle">新建项目</h3>
        <button class="icon-button" value="cancel" type="submit" aria-label="关闭">×</button>
      </div>
      <label>
        <span>项目名称</span>
        <input id="projectNameInput" required maxlength="40">
      </label>
      <label>
        <span>项目描述</span>
        <textarea id="projectDescInput" rows="3" maxlength="160"></textarea>
      </label>
      <section class="project-create-options" id="projectCreateOptions">
        <div class="detail-heading">
          <h4>创建方式</h4>
          <span>优化功能 V0.5</span>
        </div>
        <div class="creation-mode" role="radiogroup" aria-label="创建方式">
          <label class="mode-card">
            <input type="radio" name="projectMode" value="template" checked>
            <span>
              <strong>从模板开始</strong>
              <em>选择场景，自动生成列、泳道和示例任务</em>
            </span>
          </label>
          <label class="mode-card">
            <input type="radio" name="projectMode" value="blank">
            <span>
              <strong>空白项目</strong>
              <em>保留 Kanboard 原有的轻量创建方式</em>
            </span>
          </label>
        </div>
        <div class="template-area" id="templateArea">
          <div class="template-list" id="templatePicker"></div>
          <div class="template-preview" id="templatePreview"></div>
        </div>
      </section>
      <div class="modal-actions">
        <button class="secondary-button" value="cancel" type="submit">取消</button>
        <button class="primary-action compact" id="saveProjectBtn" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="columnDialog" class="modal">
    <form method="dialog" id="columnForm">
      <div class="modal-header">
        <h3 id="columnDialogTitle">新增列</h3>
        <button class="icon-button" value="cancel" type="submit" aria-label="关闭">×</button>
      </div>
      <label>
        <span>列名称</span>
        <input id="columnTitleInput" required maxlength="24">
      </label>
      <label>
        <span>WIP 限制</span>
        <input id="columnWipInput" type="number" min="0" max="99" placeholder="0 表示不限制">
      </label>
      <div class="modal-actions between">
        <button class="secondary-button danger" id="deleteColumnBtn" type="button">删除列</button>
        <div>
          <button class="secondary-button" value="cancel" type="submit">取消</button>
          <button class="primary-action compact" type="submit">保存</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="swimlaneDialog" class="modal">
    <form method="dialog" id="swimlaneForm">
      <div class="modal-header">
        <h3 id="swimlaneDialogTitle">新增泳道</h3>
        <button class="icon-button" value="cancel" type="submit" aria-label="关闭">×</button>
      </div>
      <label>
        <span>泳道名称</span>
        <input id="swimlaneTitleInput" required maxlength="28">
      </label>
      <label>
        <span>泳道说明</span>
        <textarea id="swimlaneDescInput" rows="3" maxlength="160"></textarea>
      </label>
      <div class="modal-actions between">
        <button class="secondary-button danger" id="deleteSwimlaneBtn" type="button">删除泳道</button>
        <div>
          <button class="secondary-button" value="cancel" type="submit">取消</button>
          <button class="primary-action compact" type="submit">保存</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="cardDialog" class="modal wide">
    <form method="dialog" id="cardForm">
      <div class="modal-header">
        <h3 id="cardDialogTitle">新增任务</h3>
        <button class="icon-button" value="cancel" type="submit" aria-label="关闭">×</button>
      </div>

      <div class="form-grid">
        <label class="span-2">
          <span>任务标题</span>
          <input id="cardTitleInput" required maxlength="80">
        </label>
        <label>
          <span>负责人</span>
          <input id="cardAssigneeInput" list="memberOptions" maxlength="24">
        </label>
        <label>
          <span>泳道</span>
          <select id="cardSwimlaneInput"></select>
        </label>
        <label>
          <span>分类</span>
          <input id="cardCategoryInput" list="categoryOptions" maxlength="24">
        </label>
        <label>
          <span>优先级</span>
          <select id="cardPriorityInput">
            <option value="低">低</option>
            <option value="中">中</option>
            <option value="高">高</option>
            <option value="紧急">紧急</option>
          </select>
        </label>
        <label>
          <span>截止日期</span>
          <input id="cardDueInput" type="date">
        </label>
        <label>
          <span>标签</span>
          <input id="cardTagsInput" maxlength="80" placeholder="用逗号分隔">
        </label>
        <label>
          <span>颜色</span>
          <select id="cardColorInput">
            <option value="blue">蓝</option>
            <option value="green">绿</option>
            <option value="amber">黄</option>
            <option value="rose">红</option>
            <option value="gray">灰</option>
          </select>
        </label>
        <label>
          <span>预估工时</span>
          <input id="cardEstimateInput" type="number" min="0" max="999" step="0.5" placeholder="小时">
        </label>
        <label class="span-2">
          <span>描述</span>
          <textarea id="cardDescInput" rows="5" maxlength="600"></textarea>
        </label>
      </div>

      <section class="detail-section">
        <div class="detail-heading">
          <h4>子任务</h4>
          <span id="subtaskSummary">0/0</span>
        </div>
        <div class="inline-add">
          <input id="subtaskInput" maxlength="80" placeholder="添加一个可勾选的子任务">
          <button class="secondary-button" id="addSubtaskBtn" type="button">添加</button>
        </div>
        <div class="subtask-list" id="subtaskList"></div>
      </section>

      <section class="detail-section">
        <div class="detail-heading">
          <h4>评论</h4>
        </div>
        <div class="inline-add comment-add">
          <textarea id="commentInput" rows="2" maxlength="240" placeholder="记录讨论、阻塞或结论"></textarea>
          <button class="secondary-button" id="addCommentBtn" type="button">添加评论</button>
        </div>
        <div class="comment-list" id="commentList"></div>
      </section>

      <section class="detail-section">
        <div class="detail-heading">
          <h4>活动记录</h4>
        </div>
        <div class="activity-list" id="activityList"></div>
      </section>

      <datalist id="memberOptions"></datalist>
      <datalist id="categoryOptions"></datalist>

      <div class="modal-actions between">
        <button class="secondary-button danger" id="deleteCardBtn" type="button">删除任务</button>
        <div>
          <button class="secondary-button" value="cancel" type="submit">取消</button>
          <button class="primary-action compact" type="submit">保存</button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
